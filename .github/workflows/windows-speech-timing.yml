name: Measure native x64 speech recognition
on:
  push:
    branches: [release/windows-store-media]
    paths: ['.github/workflows/windows-speech-timing.yml', 'tools/windows-speech-timing/**', 'scripts/portable-ggml.cmake', 'scripts/dispatch-sgemm.cpp']
permissions:
  contents: read
jobs:
  linux:
    name: Linux native speech and pre-AVX fallback
    needs: timing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: synthetic-speech-fixture
      - name: Verify speech on the host and the fallback on a CPU without AVX
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq qemu-user
          curl -fsSL --retry 3 https://static.crates.io/crates/whisper-rs-sys/whisper-rs-sys-0.15.0.crate -o source.tar.gz
          digest=$(python3 -c "import tomllib;print(next(x['checksum'] for x in tomllib.load(open('apps/desktop/src-tauri/Cargo.lock','rb'))['package'] if x['name']=='whisper-rs-sys'))")
          echo "$digest  source.tar.gz" | sha256sum -c -
          tar xf source.tar.gz
          cmake -S tools/windows-speech-timing -B native -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PROJECT_ggml_INCLUDE=$PWD/scripts/portable-ggml.cmake" -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF
          cmake --build native --target speech-timing matrix-check --parallel 4
          native/matrix-check
          qemu-x86_64 -cpu Nehalem native/matrix-check
          curl -fsSL --retry 3 'https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.bin' -o model.bin
          echo '60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe  model.bin' | sha256sum -c -
          native/speech-timing model.bin speech.f32
  timing:
    strategy:
      fail-fast: false
      matrix:
        repeats: [1, 2]
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download the same pinned source and model used by the desktop app
        shell: pwsh
        run: |
          $checksum = (python -c "import tomllib;print(next(x['checksum'] for x in tomllib.load(open('apps/desktop/src-tauri/Cargo.lock','rb'))['package'] if x['name']=='whisper-rs-sys'))").Trim()
          curl.exe --fail --location --retry 3 --silent --show-error https://static.crates.io/crates/whisper-rs-sys/whisper-rs-sys-0.15.0.crate -o source.tar.gz
          if ((Get-FileHash source.tar.gz).Hash -ne $checksum) { throw 'Source does not match Cargo.lock.' }
          tar -xzf source.tar.gz
          curl.exe --fail --location --retry 3 --silent --show-error 'https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.bin' -o model.bin
          if ((Get-FileHash model.bin).Hash -ne '60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe') { throw 'Speech model verification failed.' }
      - name: Prepare the six-second fixture and measure the native engine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name
          Add-Type -AssemblyName System.Speech
          $speech = [System.Speech.Synthesis.SpeechSynthesizer]::new()
          $format = [System.Speech.AudioFormat.SpeechAudioFormatInfo]::new(16000,[System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen,[System.Speech.AudioFormat.AudioChannel]::Mono)
          try {
            $speech.SetOutputToWaveFile("$pwd/notebook.wav", $format)
            $speech.Speak('I left the blue notebook on the kitchen table. Could you bring it to the design review tomorrow?')
          } finally { $speech.Dispose() }
          python -c "import struct,wave; w=wave.open('notebook.wav'); assert w.getframerate()==16000 and w.getnchannels()==1; a=[s[0]/32768 for s in struct.iter_unpack('<h',w.readframes(w.getnframes()))]; open('speech.f32','wb').write(struct.pack('<'+str(len(a))+'f',*a));print('Sample',len(a)/16000,'seconds')"
          $hook = (Resolve-Path scripts/portable-ggml.cmake).Path.Replace('\','/')
          cmake -S tools/windows-speech-timing -B native -A x64 "-DCMAKE_PROJECT_ggml_INCLUDE=$hook" -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build native --config Release --target speech-timing --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $program = Get-ChildItem native -Recurse -Filter speech-timing.exe | Select-Object -First 1
          & $program.FullName model.bin speech.f32
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.repeats == 1
        with:
          name: synthetic-speech-fixture
          path: speech.f32
          if-no-files-found: error
