name: Compare Windows release compiler settings
on:
  push:
    branches: [release/windows-store-media]
    paths: ['.github/workflows/windows-cargo-timing.yml', 'tools/windows-speech-timing/cargo-check/**']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        settings: [packaged, optimized]
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: synthetic-speech-fixture
          run-id: 45557622689
          github-token: ${{ github.token }}
      - name: Measure the release crate with the model and recording from the app checks
        shell: pwsh
        env:
          BENCH_SETTINGS: ${{ matrix.settings }}
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfLogicalProcessors
          if ($env:BENCH_SETTINGS -eq 'optimized') {
            $env:CMAKE_C_FLAGS_RELEASE = '/MD /O2 /DNDEBUG'
            $env:CMAKE_CXX_FLAGS_RELEASE = '/MD /O2 /DNDEBUG'
          }
          curl.exe -fsSL --retry 3 'https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.bin' -o model.bin
          if ((Get-FileHash model.bin).Hash -ne '60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe') { throw 'Model verification failed.' }
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'timing-target'
          cargo build --release --locked --manifest-path tools/windows-speech-timing/cargo-check/Cargo.toml
          if ($LASTEXITCODE) { throw 'Could not compile the release benchmark.' }
          Get-ChildItem "$env:CARGO_TARGET_DIR/release/build/whisper-rs-sys-*/out/build/CMakeCache.txt" | ForEach-Object {
            Select-String -Path $_ -Pattern '^CMAKE_(C|CXX)_FLAGS_RELEASE:','^GGML_(NATIVE|LLAMAFILE):' | ForEach-Object { $_.Line }
          }
          & "$env:CARGO_TARGET_DIR/release/vyrra-speech-timing.exe" model.bin speech.f32
          exit $LASTEXITCODE
