name: Capture the packaged Windows Store listing
on:
  push:
    branches: [release/windows-store-media]
    paths:
      - .github/workflows/windows-store-media.yml
      - apps/desktop/store-preview/**
permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  screenshots:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: windows-2025, sample: c }
    runs-on: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install the renderer test tools from the project lockfile
        run: |
          npm install --global pnpm@10.14.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Provision the WebView2 dependency declared in the Store manifest
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKCU:\SOFTWARE\$client")
          function Get-WebViewVersion {
            foreach ($key in $keys) {
              $version = Get-ItemPropertyValue $key -Name pv -ErrorAction SilentlyContinue
              if ($version -and [version]$version -gt [version]'0.0.0.0') { return $version }
            }
          }
          $version = Get-WebViewVersion
          if (-not $version) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'The Microsoft runtime signature is invalid.' }
            $result = Start-Process $installer -ArgumentList '/silent','/install' -Wait -PassThru
            $version = Get-WebViewVersion
            if (-not $version) { throw "Microsoft WebView2 installation returned $($result.ExitCode) without registering a runtime." }
          }
          Write-Output "Microsoft WebView2 runtime $version"
      - name: Synthesize a non-personal sample WAV on the test machine
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $speech = [System.Speech.Synthesis.SpeechSynthesizer]::new()
          try {
            $speech.Rate = -1
            $speech.SetOutputToWaveFile("$PWD/apps/desktop/store-preview/blue-notebook.wav")
            $speech.Speak('I left the blue notebook on the kitchen table. Could you bring it to the design review tomorrow?')
          } finally {
            $speech.Dispose()
          }
      - name: Open the verified Windows release in an empty runner profile
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_IMAGE: ${{ matrix.image }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = '45553046930'
          $repository = $env:GITHUB_REPOSITORY
          gh run download $run --repo $repository --name vyrra-Windows-x64 --dir package
          if ($LASTEXITCODE) { throw 'Installer download failed.' }
          $setup = @(Get-ChildItem package -Filter '*_x64-setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'Expected one x64 installer.' }
          $proof = gh attestation verify $setup[0].FullName --repo $repository --predicate-type "https://github.com/$repository/attestations/desktop-verification/v1" --signer-workflow "$repository/.github/workflows/desktop-provenance.yml" --format json
          if ($LASTEXITCODE) { throw 'Installer attestation failed.' }
          $verified = ($proof | ConvertFrom-Json) | Where-Object { $_.verificationResult.statement.predicate.run -eq "https://github.com/$repository/actions/runs/$run" }
          if (-not $verified) { throw 'The installer does not belong to the approved native run.' }
          $install = Join-Path $env:RUNNER_TEMP 'VyrraStorePreview'
          $result = Start-Process $setup[0].FullName -ArgumentList '/S',"/D=$install" -Wait -PassThru
          if ($result.ExitCode) { throw "Installer returned $($result.ExitCode)." }
          $app = @(Get-ChildItem $install -Filter '*.exe' -File | Where-Object { $_.BaseName -match '^Vyrra[- ]Desktop$' })
          if ($app.Count -ne 1) { throw 'Installed application is missing.' }
          # Only this test process on the disposable runner enables WebView2 inspection.
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'VyrraTestWebView'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --force-renderer-accessibility'
          $testPolicy = 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $testPolicy -Force | Out-Null
          New-ItemProperty -Path $testPolicy -Name $app[0].Name -Value $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS -PropertyType String -Force | Out-Null
          Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name
          $started = Get-Date
          $launch = [Diagnostics.ProcessStartInfo]::new($app[0].FullName)
          $launch.UseShellExecute = $false
          $window = [Diagnostics.Process]::Start($launch)
          try {
            if ($env:PREVIEW_IMAGE -eq 'windows-2025') {
              & ./apps/desktop/store-preview/native-dictation.ps1 -WindowProcessId $window.Id
            } else {
              node apps/desktop/store-preview/capture.mjs
              if ($LASTEXITCODE) { throw 'The native app did not complete the Store preview.' }
            }
          } finally {
            $window.Refresh()
            if ($window.HasExited) {
              Write-Output ('Vyrra exited with native status 0x{0:X8}.' -f $window.ExitCode)
              Start-Sleep -Seconds 3
              $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $started; Id = 1000,1001,1026 } -ErrorAction SilentlyContinue
              foreach ($event in $events | Where-Object { $_.Message -match 'vyrra' }) {
                $event.Message -split "`n" | Where-Object { $_ -match 'faulting application name|faulting module name|exception code|fault offset|event name|^P[1-9]:' }
              }
            } else {
              Write-Output "Vyrra remained running with window title '$($window.MainWindowTitle)'."
              Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
              $root = [Windows.Automation.AutomationElement]::FromHandle($window.MainWindowHandle)
              $nodes = $root.FindAll([Windows.Automation.TreeScope]::Descendants, [Windows.Automation.Condition]::TrueCondition)
              Write-Output "Native accessibility tree contains $($nodes.Count) elements."
              $nodes | Select-Object -First 24 | ForEach-Object { Write-Output "$($_.Current.ControlType.ProgrammaticName) $($_.Current.Name)" }
              $browsers = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue)
              Write-Output "WebView2 processes: $($browsers.Count)"
              foreach ($browser in Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'") {
                $switches = [regex]::Matches($browser.CommandLine, '--(?:remote-debugging-[a-z-]+|type|force-renderer-accessibility)(?:=[^\s]+)?').Value
                Write-Output "WebView2 pid $($browser.ProcessId): $switches"
              }
              Get-NetTCPConnection -LocalPort 9222 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "Debug port $($_.LocalAddress) $($_.State)" }
              Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application" -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
              Stop-Process -Id $window.Id
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vyrra-windows-store-screenshots-${{ matrix.image }}-${{ matrix.sample }}
          path: store-screenshots/*.png
          if-no-files-found: warn
