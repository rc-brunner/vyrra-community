name: Desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    if: github.ref != 'refs/heads/release/windows-store-media'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            bundle: nsis
            path: 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe'
          - name: Linux x64
            runner: ubuntu-24.04
            bundle: deb
            path: 'apps/desktop/src-tauri/target/release/bundle/deb/*.deb'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libclang-dev clang cmake libdbus-1-dev libxdo-dev xvfb xdotool
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @private-voice/desktop check
      - run: pnpm test
      - run: pnpm --filter @private-voice/desktop build
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm --filter @private-voice/desktop exec tauri build --bundles ${{ matrix.bundle }}
      - name: Install Linux package on a clean Ubuntu image
        if: runner.os == 'Linux'
        run: |
          deb=$(find "$PWD/apps/desktop/src-tauri/target/release/bundle/deb" -name '*.deb' -print -quit)
          docker run --rm --mount "type=bind,source=$deb,target=/tmp/vyrra.deb,readonly" \
            ubuntu:24.04 bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get -qq update
              apt-get -yqq --no-install-recommends install /tmp/vyrra.deb
              missing=$(ldd /usr/bin/vyrra-desktop | awk "/not found/")
              if test -n "$missing"; then echo "$missing"; exit 1; fi
              dpkg-query -s vyrra-desktop | head -8
            '
      - name: Launch packaged Linux application
        if: runner.os == 'Linux'
        run: |
          deb=$(find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          dpkg-deb -x "$deb" "$RUNNER_TEMP/vyrra-package"
          binary=$(find "$RUNNER_TEMP/vyrra-package/usr/bin" -type f -print -quit)
          xvfb-run -a dbus-run-session -- bash -eu -c '
            "$1" >"$RUNNER_TEMP/vyrra-start.log" 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            timeout 35 xdotool search --sync --onlyvisible --name "Vyrra Desktop" >/dev/null
          ' _ "$binary"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vyrra-${{ runner.os }}-x64
          path: ${{ matrix.path }}
          if-no-files-found: error
