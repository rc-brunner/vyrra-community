name: Desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            bundle: nsis
            path: 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe'
          - name: Linux x64
            runner: ubuntu-24.04
            bundle: deb
            path: 'apps/desktop/src-tauri/target/release/bundle/deb/*.deb'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libclang-dev clang cmake libdbus-1-dev libxdo-dev xvfb xdotool
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @private-voice/desktop check
      - run: pnpm test
      - run: pnpm --filter @private-voice/desktop build
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm --filter @private-voice/desktop exec tauri build --bundles ${{ matrix.bundle }}
      - name: Check the packaged speech engine uses the x86-64 baseline
        shell: python {0}
        run: |
          import pathlib, re, sys
          build = pathlib.Path('apps/desktop/src-tauri/target/release/build')
          caches = list(build.glob('whisper-rs-sys-*/out/build/CMakeCache.txt'))
          if not caches:
              raise SystemExit('Missing speech engine build configuration')
          for cache in caches:
              config = cache.read_text(encoding='utf-8')
              if sys.platform == 'win32':
                  for lang in ('C', 'CXX'):
                      flags = re.search(rf'^CMAKE_{lang}_FLAGS_RELEASE:STRING=(.*)$', config, re.M)
                      if not flags or not re.search(r'(?:^|\s)[/-]O(?:2|x)(?:\s|$)', flags[1]):
                          raise SystemExit(f'{cache}: missing MSVC Release optimization for {lang}')
              flags = dict(re.findall(r'^GGML_(\w+):BOOL=(\w+)$', config, re.M))
              if flags.get('LLAMAFILE') != 'ON':
                  raise SystemExit('Missing runtime-selected speech matrix kernel')
              for feature in 'NATIVE SSE42 AVX AVX2 FMA F16C BMI2 AVX_VNNI AVX512 AVX512_VBMI AVX512_VNNI AVX512_BF16 AMX_TILE AMX_INT8 AMX_BF16'.split():
                  if flags.get(feature) != 'OFF':
                      raise SystemExit(f'{cache}: expected GGML_{feature}=OFF, found {flags.get(feature)}')
      - name: Transcribe a known sentence with the release speech engine
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VYRRA_TEST_MODEL = Join-Path $env:RUNNER_TEMP 'vyrra-test-model.bin'
          $env:VYRRA_TEST_WAV = Join-Path $env:RUNNER_TEMP 'vyrra-test-sentence.wav'
          curl.exe --fail --location --retry 3 --silent --show-error 'https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.bin' -o $env:VYRRA_TEST_MODEL
          if ($LASTEXITCODE) { throw 'The pinned speech model could not be downloaded.' }
          Add-Type -AssemblyName System.Speech
          $voice = [System.Speech.Synthesis.SpeechSynthesizer]::new()
          try {
            $voice.SetOutputToWaveFile($env:VYRRA_TEST_WAV)
            $voice.Speak('Please bring the blue notebook to the meeting on Friday.')
          } finally { $voice.Dispose() }
          $messages = cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --no-run --message-format=json
          if ($LASTEXITCODE) { throw 'The release integration test could not be compiled.' }
          $binary = $messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.target.name -eq 'vyrra_desktop_lib' -and $_.executable } | Select-Object -Last 1 -ExpandProperty executable
          if (-not $binary) { throw 'The release test executable was not found.' }
          @'
          import subprocess
          import sys

          binary = sys.argv[1]
          case = 'dictation::tests::desktop_decodes_known_speech_offline'
          listing = subprocess.check_output([binary, '--ignored', '--list'], text=True)
          if f'{case}: test' not in listing.splitlines():
              raise SystemExit('The release speech test was not found.')
          subprocess.run([binary, '--ignored', '--exact', case, '--nocapture'], timeout=90, check=True)
          '@ | python - $binary
          if ($LASTEXITCODE -ne 0) { throw 'The release speech test failed.' }
      - name: Install Linux package on a clean Ubuntu image
        if: runner.os == 'Linux'
        run: |
          deb=$(find "$PWD/apps/desktop/src-tauri/target/release/bundle/deb" -name '*.deb' -print -quit)
          docker run --rm --mount "type=bind,source=$deb,target=/tmp/vyrra.deb,readonly" \
            ubuntu:24.04 bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get -qq update
              apt-get -yqq --no-install-recommends install /tmp/vyrra.deb
              missing=$(ldd /usr/bin/vyrra-desktop | awk "/not found/")
              if test -n "$missing"; then echo "$missing"; exit 1; fi
              dpkg-query -s vyrra-desktop | head -8
            '
      - name: Launch packaged Linux application
        if: runner.os == 'Linux'
        run: |
          deb=$(find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          dpkg-deb -x "$deb" "$RUNNER_TEMP/vyrra-package"
          binary=$(find "$RUNNER_TEMP/vyrra-package/usr/bin" -type f -print -quit)
          xvfb-run -a dbus-run-session -- bash -eu -c '
            "$1" >"$RUNNER_TEMP/vyrra-start.log" 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            deadline=$((SECONDS + 35))
            while (( SECONDS < deadline )) && kill -0 "$app_pid" 2>/dev/null; do
              if xdotool search --onlyvisible --name "^Vyrra Desktop$" >/dev/null 2>&1; then
                exit 0
              fi
              sleep 0.3
            done
            cat "$RUNNER_TEMP/vyrra-start.log" >&2
            echo "The packaged application did not open its window." >&2
            exit 1
          ' _ "$binary"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vyrra-${{ runner.os }}-x64
          path: ${{ matrix.path }}
          if-no-files-found: error
