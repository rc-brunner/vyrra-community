name: Installed desktop model checks
on:
  push:
    branches: [qa/catalog-installed-app]
permissions:
  contents: read
  actions: read
jobs:
  catalog:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Get the packages for the verified catalog revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=45574519356
          rev=b64c409dd91661d7904f93316e0f9164e714d2bb
          [[ "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$rev" ]]
          artifact="vyrra-${RUNNER_OS}-x64"
          for attempt in {1..135}; do
            ready=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.expired == false) | .name')
            if grep -Fxq "$artifact" <<< "$ready"; then break; fi
            sleep 10
          done
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$artifact" -D package
      - name: Provision the WebView2 dependency declared in the Store manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKCU:\SOFTWARE\$client")
          function Get-WebViewVersion {
            foreach ($key in $keys) {
              $version = Get-ItemPropertyValue $key -Name pv -ErrorAction SilentlyContinue
              if ($version -and [version]$version -gt [version]'0.0.0.0') { return $version }
            }
          }
          $version = Get-WebViewVersion
          if (-not $version) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'The Microsoft runtime signature is invalid.' }
            $result = Start-Process $installer -ArgumentList '/silent','/install' -Wait -PassThru
            $version = Get-WebViewVersion
            if (-not $version) { throw "Microsoft WebView2 installation returned $($result.ExitCode) without registering a runtime." }
          }
          Write-Output "Microsoft WebView2 runtime $version"
      - name: Synthesize a non-personal sample WAV on the test machine
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $speech = [System.Speech.Synthesis.SpeechSynthesizer]::new()
          try {
            $speech.Rate = -1
            $speech.SetOutputToWaveFile("$PWD/apps/desktop/store-preview/blue-notebook.wav")
            $speech.Speak('I left the blue notebook on the kitchen table. Could you bring it to the design review tomorrow?')
          } finally {
            $speech.Dispose()
          }
      - name: Exercise the installed Windows app in an empty profile
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem package -Filter '*_x64-setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'Expected one x64 installer.' }
          $install = Join-Path $env:RUNNER_TEMP 'VyrraCatalog'
          $result = Start-Process $setup[0].FullName -ArgumentList '/S',"/D=$install" -Wait -PassThru
          if ($result.ExitCode) { throw "Installer returned $($result.ExitCode)." }
          $app = @(Get-ChildItem $install -Filter '*.exe' -File | Where-Object { $_.BaseName -match '^Vyrra[- ]Desktop$' })
          if ($app.Count -ne 1) { throw 'Installed app missing.' }
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'CatalogWebView2'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--force-renderer-accessibility'
          $window = Start-Process $app[0].FullName -PassThru
          try {
            & ./apps/desktop/store-preview/native-dictation.ps1 -WindowProcessId $window.Id
          } finally { Stop-Process -Id $window.Id -ErrorAction SilentlyContinue }
      - name: Exercise the installed Ubuntu app on an isolated display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ./package/*.deb xvfb xauth dbus-x11 at-spi2-core python3-pyatspi xdotool xdg-desktop-portal-gtk zenity
          export VYRRA_TEST_WAV="$RUNNER_TEMP/test-speech.wav"
          curl --fail --location --retry 3 --silent --show-error 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/adf50b68c113a4db234a2711bc678a92cb13b8a2/samples/jfk.wav' -o "$VYRRA_TEST_WAV"
          echo "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  $VYRRA_TEST_WAV" | sha256sum -c -
          export NO_AT_BRIDGE=0 GTK_MODULES=atk-bridge XDG_CURRENT_DESKTOP=GNOME
          dbus-run-session -- xvfb-run -a bash -ec '
            dbus-update-activation-environment DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP NO_AT_BRIDGE GTK_MODULES
            gsettings set org.gnome.desktop.interface toolkit-accessibility true
            gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.freedesktop.DBus.Properties.Set org.a11y.Status IsEnabled "<true>"
            /usr/bin/python3 apps/desktop/store-preview/linux-catalog.py
          '
