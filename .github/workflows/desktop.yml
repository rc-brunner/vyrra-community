name: Desktop checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @private-voice/desktop check
      - run: pnpm test
      - run: pnpm --filter @private-voice/desktop build
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm --filter @private-voice/desktop exec tauri build --bundles nsis
