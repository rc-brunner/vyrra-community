name: Test packaged Windows installer
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Desktop checks run with verified packages
        required: true
        type: string
      store_identity:
        description: Package/Identity/Name from Partner Center (leave empty for a packaging test)
        type: string
      store_publisher:
        description: Package/Identity/Publisher from Partner Center
        type: string
      publisher_display_name:
        description: Package/Properties/PublisherDisplayName from Partner Center
        type: string
permissions:
  actions: read
  attestations: read
  contents: read

jobs:
  install:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Verify the installer from the selected native build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main' -or $env:BUILD_RUN -notmatch '^\d+$') { throw 'Select a native build from main.' }
          gh run download $env:BUILD_RUN --repo $env:GITHUB_REPOSITORY --name vyrra-Windows-x64 --dir package
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the Windows package.' }
          $files = @(Get-ChildItem package -Filter '*_x64-setup.exe' -File)
          if ($files.Count -ne 1) { throw 'Expected a single x64 installer.' }
          Move-Item $files[0].FullName package/Vyrra-Windows-x64.exe
          $predicate = "https://github.com/$env:GITHUB_REPOSITORY/attestations/desktop-verification/v1"
          $proof = gh attestation verify package/Vyrra-Windows-x64.exe --repo $env:GITHUB_REPOSITORY --predicate-type $predicate --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/desktop-provenance.yml" --format json
          if ($LASTEXITCODE -ne 0) { throw 'Installer verification failed.' }
          $nativeRun = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN"
          $verified = ($proof | ConvertFrom-Json) | Where-Object { $_.verificationResult.statement.predicate.run -eq $nativeRun }
          if (-not $verified) { throw 'The attestation does not identify the selected build.' }
          "NATIVE_COMMIT=$($verified[0].verificationResult.statement.predicate.commit)" >> $env:GITHUB_ENV

      - name: Install and open the packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'vyrra-installed'
          $installer = Start-Process package/Vyrra-Windows-x64.exe -ArgumentList '/S',"/D=$destination" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installation failed with exit code $($installer.ExitCode)." }
          $app = @(Get-ChildItem $destination -File -Filter '*.exe' | Where-Object { $_.BaseName -match '^Vyrra[- ]Desktop$' })
          if ($app.Count -ne 1) { throw 'The installer did not produce the desktop executable.' }
          $process = Start-Process $app[0].FullName -PassThru
          try {
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $primary = [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty, 'Library')
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Vyrra exited with code $($process.ExitCode)." }
              if ($process.MainWindowHandle -ne 0 -and $process.MainWindowTitle -eq 'Vyrra Desktop') {
                $window = [Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
                $library = $window.FindFirst([Windows.Automation.TreeScope]::Descendants, $primary)
                if ($null -ne $library) { break }
              }
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($null -eq $library) { throw 'The installed desktop app did not render its Library navigation.' }
            Write-Output 'Installed Vyrra Desktop and found its Library navigation in the running window.'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NATIVE_COMMIT }}
          path: source
          sparse-checkout: apps/desktop/src-tauri
          persist-credentials: false
      - name: Package the verified application for Microsoft Store
        shell: pwsh
        env:
          STORE_IDENTITY: ${{ inputs.store_identity }}
          STORE_PUBLISHER: ${{ inputs.store_publisher }}
          STORE_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
        run: |
          $identity = @($env:STORE_IDENTITY, $env:STORE_PUBLISHER, $env:STORE_DISPLAY_NAME) | Where-Object { $_ }
          if ($identity.Count -eq 0) {
            $identity = @('Vyrra.PackagingTest', 'CN=Vyrra Packaging Test', 'Vyrra Packaging Test')
          } elseif ($identity.Count -ne 3) {
            throw 'Supply all three identity fields from the same Partner Center product.'
          }
          ./tools/scripts/package-windows-store.ps1 -InstalledDirectory "$env:RUNNER_TEMP/vyrra-installed" -ProjectDirectory ./source/apps/desktop/src-tauri -IdentityName $identity[0] -Publisher $identity[1] -PublisherDisplayName $identity[2] -OutputFile "$env:RUNNER_TEMP/Vyrra-Windows-x64.msix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.store_identity != '' && inputs.store_publisher != '' && inputs.publisher_display_name != ''
        with:
          name: vyrra-Windows-Store-x64
          path: ${{ runner.temp }}/Vyrra-Windows-x64.msix
          if-no-files-found: error
