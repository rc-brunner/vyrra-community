[package]
name = "vyrra-desktop"
version = "0.1.1"
description = "Vyrra Desktop native application shell"
authors = ["Runner Concepts"]
homepage = "https://vyrra.ai"
repository = "https://github.com/rc-brunner/vyrra-community"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
name = "vyrra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-global-shortcut = "=2.3.2"
cpal = "=0.16.0"
whisper-rs = "=0.16.0"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "=3.5.2", features = ["json"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
url = "2"
time = { version = "0.3", features = ["formatting"] }
open = "5"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
hound = "=3.5.1"
rfd = "=0.15.4"
fs2 = "0.4"
candle-core = "=0.11.1"
candle-transformers = "=0.11.1"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "=0.2.0"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "=0.6.2"
objc2 = "=0.6.4"
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["libc", "NSPasteboard", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse"] }

# Apple's strip can remove Rust metadata needed to load host procedural macros.
[profile.release.build-override]
strip = "none"
